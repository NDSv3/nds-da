
name: Build and Publish Documentation

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ndsv3/nds-da:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON

      - name: Build sources
        run: cmake --build build --target all

      - name: Run tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --output-junit build/tests.xml

      - name: Generate coverage
        run: cmake --build build --target coverage

      - name: Publish test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            build/tests.xml
            build/coverage/coverage.xml
            build/coverage/details/
          if-no-files-found: warn
          retention-days: 7

  build-docs:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-results
          path: build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz fonts-freefont-ttf make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Prepare documentation
        run: |
          mkdir -p docs/_coverage
          cp -r build/coverage/details/. docs/_coverage/

      - name: Build documentation
        run: make -C docs html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

