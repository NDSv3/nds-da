build-docs:
    image: nakatt/doxygen
    stage: build-test
    script:
        - cd docs
        - pip install -r docs/requirements.txt
        - make -C docs html
        - mkdir -p public
        - cp -r docs/_build/html/* public/
    artifacts:
        paths:
            - public
        expire_in: 1 min

pages:
    stage: deploy
    needs:
        # - job: build-sources
        #   artifacts: true
        - job: build-docs
          artifacts: true
    script:
        - echo "Deploying to GitLab Pages..."
    #     - mkdir -p public/coverage
    #     - cp -r build/coverage/details/* public/coverage/
    artifacts:
        paths:
            - public
    pages: true
