image: registry.i2a2.upm.es/iter/nds/nds-deviceaccess:latest

workflow:
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'

stages:
    - build-test
    - build-docs
    - deploy

build-sources:
    stage: build-test
    script:
        - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
        - cmake --build build --target all
        - ctest --test-dir build --output-on-failure --output-junit tests.xml
        - cmake --build build --target coverage
    artifacts:
        reports:
            junit: build/tests.xml
            coverage_report:
                coverage_format: cobertura
                path: build/coverage/coverage.xml
        paths:
            - build/coverage/details

build-docs:
    image: python:3.12-alpine
    stage: build-docs
    needs:
        - build-sources
    script:
        - apk add --no-cache doxygen graphviz ttf-freefont make
        - pip install -r docs/requirements.txt
        - mkdir -p docs/_coverage
        - cp -r build/coverage/details/* docs/_coverage/
        - make -C docs html
    artifacts:
        paths:
            - docs/_build/html
        expire_in: 1 min

pages:
    stage: deploy
    needs:
        - build-docs
    script:
        - mkdir -p public
        - cp -r docs/_build/html/* public/
    artifacts:
        paths:
            - public
    pages: true